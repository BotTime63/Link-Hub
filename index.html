<style>
/* =========================================================
   LINK HUB
   Simple iPhone-first launcher
   ========================================================= */

:root {
    --bg: #101410;
    --card: #191d19;
    --card-hover: #222822;
    --border: #2b332b;
    --text: #f1f3f1;
    --muted: #969d96;
    --green: #48d369;
    --green-dark: #1f8f3d;
    --danger: #ff4f5e;
    --shadow: rgba(0, 0, 0, 0.35);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    padding-bottom: 30px;
}

/* =========================================================
   HEADER
   ========================================================= */

header {
    position: sticky;
    top: 0;
    z-index: 50;

    padding:
        calc(env(safe-area-inset-top) + 14px)
        16px
        14px;

    background: rgba(16, 20, 16, 0.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    border-bottom: 1px solid var(--border);
}

.header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.logo-title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.link-count {
    color: var(--muted);
    font-size: 13px;
}

/* =========================================================
   MAIN
   ========================================================= */

main {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 18px 14px 0;
}

/* =========================================================
   FAVORITES
   ========================================================= */

.section {
    margin-bottom: 28px;
}

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin: 0 4px 12px;

    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--muted);
}

.section-title.favorite-title {
    color: var(--text);
}

/* =========================================================
   ICON GRID
   ========================================================= */

.icon-grid {
    display: grid;

    /*
       4 columns on most iPhones.
       The minmax lets this adapt to larger screens.
    */
    grid-template-columns: repeat(4, minmax(0, 1fr));

    gap: 16px 13px;
}

/* =========================================================
   APP ICON
   ========================================================= */

.app-item {
    position: relative;
    min-width: 0;
}

.app-button {
    position: relative;

    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;

    padding: 0;

    border: 0;
    border-radius: 20%;

    background: var(--card);

    overflow: hidden;

    cursor: pointer;

    box-shadow:
        0 4px 12px var(--shadow);

    transition:
        transform 0.12s ease,
        background 0.12s ease;
}

.app-button:active {
    transform: scale(0.91);
    background: var(--card-hover);
}

/* The actual site image */

.app-icon {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: var(--card);

    /*
       Prevent broken/slow image layout
       from moving the page around.
    */
    border: 0;
}

/* =========================================================
   FALLBACK ICON
   ========================================================= */

.icon-fallback {
    position: absolute;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    font-size: 32px;
    font-weight: 800;

    color: var(--green);

    background:
        linear-gradient(
            145deg,
            #202620,
            #151915
        );
}

.app-button.image-error .icon-fallback {
    display: flex;
}

/* =========================================================
   HEART BUTTON
   ========================================================= */

.favorite-button {
    position: absolute;

    top: -6px;
    right: -6px;

    z-index: 5;

    width: 31px;
    height: 31px;

    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 2px solid var(--bg);
    border-radius: 50%;

    background: rgba(20, 23, 20, 0.94);

    color: #ffffff;

    font-size: 15px;
    line-height: 1;

    cursor: pointer;

    box-shadow: 0 3px 8px rgba(0,0,0,0.35);

    transition:
        transform 0.12s ease,
        color 0.12s ease,
        background 0.12s ease;
}

.favorite-button:active {
    transform: scale(0.82);
}

.favorite-button.active {
    color: #ff4f67;
    background: #241518;
}

/* =========================================================
   CATEGORY LABEL
   ========================================================= */

.category-name {
    margin-top: 7px;

    width: 100%;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    text-align: center;

    font-size: 11px;
    font-weight: 600;

    color: var(--muted);
}

/*
   Set this to display:none if you want a completely
   text-free iOS launcher.
*/
.show-labels .category-name {
    display: block;
}

/* =========================================================
   EMPTY FAVORITES
   ========================================================= */

.empty-favorites {
    padding: 18px;

    border: 1px dashed var(--border);
    border-radius: 16px;

    text-align: center;

    color: var(--muted);
    font-size: 13px;
}

/* =========================================================
   RANDOM BUTTON
   ========================================================= */

.random-section {
    margin-top: 8px;
    margin-bottom: 22px;
}

.random-button {
    width: 100%;

    border-radius: 17px;

    letter-spacing: 0.1px;

    cursor: pointer;

    box-shadow:
        0 7px 18px rgba(44, 180, 77, 0.22);

    transition:
        transform 0.12s ease,
        filter 0.12s ease;
}

.random-button:active {
    transform: scale(0.97);
    filter: brightness(0.9);
}

/* =========================================================
   SEARCH
   ========================================================= */

.search-section {
    margin-bottom: 28px;
}

.search-box {
    display: flex;
    gap: 8px;
}

.search-input,
.search-select,
.search-go {
    height: 47px;

    border: 1px solid var(--border);
    border-radius: 13px;

    background: var(--card);
    color: var(--text);

    font-size: 14px;

    outline: none;
}

.search-input {
    flex: 1;
    min-width: 0;

}

.search-input::placeholder {
    color: #777e77;
}

.search-input:focus,

    border-color: var(--green-dark);
}

.search-select {
    width: 92px;
    padding: 0 7px;
}

.search-go {
    width: 50px;

    color: #07100a;

    border-color: var(--green);

    font-weight: 900;
}

.search-go:active {
    transform: scale(0.94);
}

/* =========================================================
   CATEGORY DIVIDER
   ========================================================= */

.category-section {
    margin-bottom: 30px;
}

/* =========================================================
   BROWSER MODAL
   ========================================================= */

.browser-modal {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: none;
    flex-direction: column;

    background: #000;
}

.browser-modal.open {
    display: flex;
}

.browser-header {
    flex-shrink: 0;

    display: flex;
    align-items: center;
    gap: 8px;

    border-bottom: 1px solid #292d29;
}

.browser-title {

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;

    font-size: 13px;
    font-weight: 700;

    color: var(--text);
}

.browser-button {
    height: 37px;

    padding: 0 12px;

    border: 1px solid #343a34;
    border-radius: 10px;

    background: #202420;
    color: var(--text);

    font-size: 12px;
    font-weight: 700;

    white-space: nowrap;
}

.browser-button:active {
    transform: scale(0.94);
}

.browser-close {
    background: #2b171a;
    color: #ff6975;
}

.browser-frame {
    flex: 1;

    width: 100%;
    height: 100%;

    border: 0;

    background: #fff;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 20px);

    z-index: 200;

    transform:
        translate(-50%, 20px);

    padding: 11px 16px;

    border-radius: 13px;

    background: rgba(30, 34, 30, 0.96);
    border: 1px solid var(--border);

    color: var(--text);

    font-size: 13px;
    font-weight: 700;

    opacity: 0;
    pointer-events: none;

    transition:
        opacity 0.18s ease,
        transform 0.18s ease;
}

.toast.show {
    opacity: 1;
    transform:
        translate(-50%, 0);
}

/* =========================================================
   SMALLER SCREENS
   ========================================================= */

@media (max-width: 350px) {

    .icon-grid {
        gap: 12px 9px;
    }

    .category-name {
        font-size: 10px;
    }

    .favorite-button {

/* =========================================================
   TABLET / LARGE SCREEN
   ========================================================= */

        padding-right: 24px;
    }

.no-labels .category-name {

   ========================================================= */

let favorites = [];
let shuffledLinks = [];
let currentIndex = 0;

   DOM
   ========================================================= */

const favoritesContainer =

   START APP
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    initialize
);


function initialize() {

    loadFavorites();

    loadShuffle();

    updateLinkCount();

    renderFavorites();

    renderCategories();

}


/* =========================================================
   LINK COUNT
   ========================================================= */

function updateLinkCount() {

    const count =
        ALL_LINKS.length;

    linkCount.textContent =
        `${count} ${count === 1 ? "link" : "links"}`;
}


/* =========================================================
   FAVORITES
   ========================================================= */

function loadFavorites() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE.favorites
            );

        if (!saved) {
            favorites = [];
            return;
        }

        const parsed =
            JSON.parse(saved);

        if (!Array.isArray(parsed)) {
            favorites = [];
            return;
        }

        favorites =
            parsed.filter(
                url =>
                    ALL_LINKS.some(
                        link => link.url === url
                    )
            );

    } catch (error) {

        favorites = [];

    }
}


function saveFavorites() {

    try {

        localStorage.setItem(
            STORAGE.favorites,
            JSON.stringify(favorites)
        );

    } catch (error) {

        console.warn(
            "Could not save favorites.",
            error
        );

    }
}


function isFavorite(url) {

    return favorites.includes(url);
}


function toggleFavorite(url) {

    if (isFavorite(url)) {

        favorites =
            favorites.filter(
                item => item !== url
            );

        showToast("Removed from Favorites");

    } else {

        favorites.push(url);

        showToast("Added to Favorites ❤️");

    }

    saveFavorites();

    renderFavorites();

    /*
       Re-rendering the categories also updates
       every heart immediately.
    */
    renderCategories();

}

   FIND LINK
   ========================================================= */

    return ALL_LINKS.find(
        link => link.url === url
    );

}


/* =========================================================
   CREATE APP ICON
   ========================================================= */

function createAppIcon(link) {

    const item =
        document.createElement("div");

    item.className =
        "app-item";


    /* ---------------------------------------------
       Main icon button
       --------------------------------------------- */

    const button =
        document.createElement("button");

    button.type = "button";

    button.className =
        "app-button";

    button.setAttribute(
        "aria-label",
        `Open ${link.name}`
    );


    /* ---------------------------------------------
       Image
       --------------------------------------------- */

    const image =
        document.createElement("img");

    image.className =
        "app-icon";

    image.src =
        link.icon;

    image.alt =
        "";

    /*
       These help the browser load lots of icons
       without making the page wait for all of them.
    */
    image.loading =
        "lazy";

    image.decoding =
        "async";


    /* ---------------------------------------------
       Fallback
       --------------------------------------------- */

    const fallback =
        document.createElement("div");

    fallback.className =
        "icon-fallback";

    fallback.textContent =
        getInitials(link.name);


    image.addEventListener(
        "error",
        () => {

            button.classList.add(
                "image-error"
            );

        },
        { once: true }
    );


    button.appendChild(image);

    button.appendChild(fallback);


    /* ---------------------------------------------
       Open link
       --------------------------------------------- */

    button.addEventListener(
        "click",
        () => openInBrowser(link)
    );


    /* ---------------------------------------------
       Heart
       --------------------------------------------- */

    const heart =
        document.createElement("button");

    heart.type = "button";

    heart.className =
        "favorite-button";

    heart.setAttribute(
        "aria-label",
        `Favorite ${link.name}`
    );

    updateHeartButton(
        heart,
        link.url
    );


    heart.addEventListener(
        "click",
        event => {

            /*
               Prevent the heart tap from also
               opening the website.
            */
            event.stopPropagation();

            toggleFavorite(link.url);

        }
    );


    /* ---------------------------------------------
       Label
       --------------------------------------------- */

    const label =
        document.createElement("div");

    label.className =
        "category-name";

    label.textContent =
        link.name;


    item.appendChild(button);

    item.appendChild(heart);

    item.appendChild(label);


    return item;
}


/* =========================================================
   HEART BUTTON STATE
   ========================================================= */

function updateHeartButton(
    button,
    url
) {

    const active =
        isFavorite(url);

    button.classList.toggle(
        "active",
        active
    );

    button.textContent =
        active ? "♥" : "♡";

}


/* =========================================================
   INITIALS FALLBACK
   ========================================================= */

function getInitials(name) {

    return name
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(
            word =>
                word.charAt(0).toUpperCase()
        )
        .join("");

}


/* =========================================================
   RENDER FAVORITES
   ========================================================= */

function renderFavorites() {

    favoritesContainer.innerHTML = "";


    if (favorites.length === 0) {

        const empty =
            document.createElement("div");

        empty.className =
            "empty-favorites";

        empty.textContent =
            "Heart an app to pin it here.";

        favoritesContainer.appendChild(
            empty
        );

        return;
    }


    const grid =
        document.createElement("div");

    grid.className =
        "icon-grid";


    favorites.forEach(url => {

        const link =
            findLinkByUrl(url);

        if (!link) return;

        grid.appendChild(
            createAppIcon(link)
        );

    });


    favoritesContainer.appendChild(
        grid
    );
}


/* =========================================================
   RENDER CATEGORIES
   ========================================================= */

function renderCategories() {

    categoriesContainer.innerHTML = "";


    CATEGORIES.forEach(category => {

        const section =
            document.createElement("section");

        section.className =
            "category-section";


        const title =
            document.createElement("div");

        title.className =
            "section-title";

        title.textContent =
            category.name;


        const grid =
            document.createElement("div");

        grid.className =
            "icon-grid";


        category.links.forEach(link => {

            grid.appendChild(
                createAppIcon(link)
            );

        });


        section.appendChild(title);

        section.appendChild(grid);

        categoriesContainer.appendChild(
            section
        );

    });

}


/* =========================================================
   SHUFFLE
   ========================================================= */

function createShuffle() {

    shuffledLinks =
        [...ALL_LINKS];

    /*
       Fisher-Yates shuffle.
       Fast and unbiased.
    */

    for (
        let i = shuffledLinks.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            shuffledLinks[i],
            shuffledLinks[j]
        ] =
        [
            shuffledLinks[j],
            shuffledLinks[i]
        ];

    }

    currentIndex = 0;

    saveShuffle();

}


function loadShuffle() {

    try {

        const savedQueue =
            localStorage.getItem(
                STORAGE.shuffle
            );

        const savedIndex =
            localStorage.getItem(
                STORAGE.index
            );


        if (!savedQueue) {

            createShuffle();

            return;
        }


        const parsed =
            JSON.parse(savedQueue);


        if (
            !Array.isArray(parsed) ||
            parsed.length !== ALL_LINKS.length
        ) {

            createShuffle();

            return;
        }


        /*
           Make sure every stored URL still
           exists in the current list.
        */

        const valid =
            parsed.every(
                url =>
                    ALL_LINKS.some(
                        link => link.url === url
                    )
            );


        if (!valid) {

            createShuffle();

            return;
        }


        shuffledLinks =
            parsed
                .map(
                    url => findLinkByUrl(url)
                )
                .filter(Boolean);


        currentIndex =
            Number.isInteger(
                Number(savedIndex)
            )
            ? Number(savedIndex)
            : 0;


        if (
            currentIndex < 0 ||
            currentIndex >= shuffledLinks.length
        ) {

            currentIndex = 0;

        }

    } catch (error) {

        createShuffle();

    }

}


function saveShuffle() {

    try {

        localStorage.setItem(
            STORAGE.shuffle,
            JSON.stringify(
                shuffledLinks.map(
                    link => link.url
                )
            )
        );

        localStorage.setItem(
            STORAGE.index,
            String(currentIndex)
        );

    } catch (error) {

        console.warn(
            "Could not save shuffle progress.",
            error
        );

    }

}


/* =========================================================
   RANDOM LINK
   ========================================================= */

function openRandom() {

    if (ALL_LINKS.length === 0) {

        showToast("No links available.");

        return;
    }


    if (
        shuffledLinks.length === 0 ||
        currentIndex >= shuffledLinks.length
    ) {

        createShuffle();

    }


    const link =
        shuffledLinks[currentIndex];


    currentIndex++;

    saveShuffle();

    openInBrowser(link);

}


/* =========================================================
   OPEN LINK
   ========================================================= */

function openInBrowser(link) {

    if (!link || !link.url) {
        return;
    }

    browserTitle.textContent =
        link.name || "Link Hub";

    browserFrame.src =
        link.url;

    safariButton.onclick =
        () => {

            window.open(
                link.url,
                "_blank"
            );

        };

    browserModal.classList.add(
        "open"
    );

    browserModal.setAttribute(
        "aria-hidden",
        "false"
    );

}


/* =========================================================
   CLOSE BROWSER
   ========================================================= */

function closeBrowser() {

    browserModal.classList.remove(
        "open"
    );

    browserModal.setAttribute(
        "aria-hidden",
        "true"
    );

    /*
       Clearing the iframe stops the website
       from continuing to use resources after
       the user closes it.
    */

    browserFrame.src =
        "about:blank";

}


/* =========================================================
   SEARCH / INJECT
   ========================================================= */

function performSearch() {

    const query =
        searchInput.value.trim();

    const site =
        searchSite.value;


    if (!query) {

        showToast("Enter something to search.");

        searchInput.focus();

        return;
    }


    const encoded =
        encodeURIComponent(query);

    let url = "";


    switch (site) {

        case "reddit":

            url =
                `https://www.reddit.com/search/?q=${encoded}`;

            break;


        case "x":

            url =
                `https://x.com/search?q=${encoded}`;

            break;


        case "ao3":

            url =
                `https://archiveofourown.org/works/search?work_search%5Bquery%5D=${encoded}`;

            break;


        case "pixiv":

            url =
                `https://www.pixiv.net/tags/${encoded}`;

            break;


        case "kurosearch":

            url =
                `https://kurosearch.com/?q=${encoded}`;

            break;


        case "janitorai":

            url =
                `https://janitorai.com/search?query=${encoded}`;

            break;


        case "spicychat":

            url =
                `https://spicychat.ai/search?q=${encoded}`;

            break;


        case "youtube":

            url =
                `https://www.youtube.com/results?search_query=${encoded}`;

            break;


        case "google":

            url =
                `https://www.google.com/search?q=${encoded}`;

            break;


        default:

            url =
                `https://www.google.com/search?q=${encoded}`;

    }


    openInBrowser({
        name: `${site} search`,
        url: url
    });

}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer = null;


function showToast(message) {

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1500
        );

}


/* =========================================================
   EVENTS
   ========================================================= */

randomButton.addEventListener(
    "click",
    openRandom
);


searchGo.addEventListener(
    "click",
    performSearch
);


searchInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            performSearch();

        }

    }
);


browserClose.addEventListener(
    "click",
    closeBrowser
);


/*
   Tapping the dark browser area isn't possible
   because the iframe fills it, so only Close
   controls the modal.
*/


/* =========================================================
   ESCAPE KEY
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            browserModal.classList.contains("open")
        ) {

            closeBrowser();

        }

    }
);

</script>
