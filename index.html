<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#101114">

    <title>Link Hub</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background: #101114;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #1a1d24 0%, #101114 42%);
            color: #f2f3f5;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                system-ui,
                sans-serif;
            padding:
                calc(12px + env(safe-area-inset-top))
                14px
                calc(28px + env(safe-area-inset-bottom));
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        .header {
            max-width: 720px;
            margin: 0 auto 18px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .title-wrap h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        .subtitle {
            margin-top: 4px;
            color: #858b96;
            font-size: 13px;
        }

        .yandex-btn {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            border-radius: 14px;
            background: #1c1f25;
            color: #fff;
            font-size: 18px;
            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.07),
                0 6px 20px rgba(0,0,0,0.22);
        }

        .yandex-btn:active {
            transform: scale(0.94);
        }

        /* =========================================================
           RANDOM
        ========================================================= */

        .random-card {
            max-width: 720px;
            margin: 0 auto 14px;
        }

        .random-btn {
            width: 100%;
            min-height: 68px;
            border-radius: 20px;
            background: linear-gradient(
                135deg,
                #242931,
                #191c21
            );
            color: #fff;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.2px;
            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.08),
                0 10px 30px rgba(0,0,0,0.24);
        }

        .random-btn:active {
            transform: scale(0.985);
        }

        .progress {
            margin-top: 8px;
            text-align: center;
            color: #707681;
            font-size: 12px;
        }

        /* =========================================================
           SEARCH
        ========================================================= */

        .search-panel {
            max-width: 720px;
            margin: 0 auto 20px;
        }

        .search-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
        }

        .search-input {
            min-width: 0;
            height: 48px;
            padding: 0 15px;
            border: 0;
            outline: none;
            border-radius: 15px;
            background: #191c21;
            color: #fff;
            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.07);
        }

        .search-input::placeholder {
            color: #686e79;
        }

        .go-btn {
            min-width: 58px;
            padding: 0 15px;
            border-radius: 15px;
            background: #58a6ff;
            color: #07111c;
            font-weight: 800;
        }

        .search-tools {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .search-select {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 0;
            border-radius: 13px;
            outline: none;
            background: #191c21;
            color: #dfe2e7;
        }

        /* =========================================================
           CONTENT
        ========================================================= */

        #content {
            max-width: 720px;
            margin: 0 auto;
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 0 4px 10px;
            color: #aab0ba;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .section-count {
            color: #626873;
            font-weight: 600;
        }

        /* =========================================================
           FAVORITES — iOS STYLE APP ICONS
        ========================================================= */

        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .favorite-tile {
            position: relative;
            aspect-ratio: 1 / 1;
            min-width: 0;
            overflow: hidden;
            border-radius: 22%;
            background: #1b1e24;
            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.08),
                0 8px 22px rgba(0,0,0,0.28);
            isolation: isolate;
        }

        .favorite-tile:active {
            transform: scale(0.93);
        }

        .favorite-tile .icon-wrap {
            width: 100%;
            height: 100%;
            border-radius: inherit;
        }

        .favorite-tile img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .favorite-remove {
            position: absolute;
            z-index: 5;
            top: 5px;
            right: 5px;
            width: 27px;
            height: 27px;
            border-radius: 50%;
            background: rgba(0,0,0,0.62);
            color: #fff;
            font-size: 14px;
            line-height: 27px;
            text-align: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .favorite-remove:active {
            transform: scale(0.85);
        }

        /* =========================================================
           NORMAL LINK ROWS
        ========================================================= */

        .links {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .link-card {
            --brand: #58a6ff;

            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 62px;
            padding: 9px 10px;
            border-radius: 17px;
            background: #181b20;
            color: #fff;
            text-align: left;
            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.055);
            transition:
                transform 0.12s ease,
                background 0.12s ease;
        }

        .link-card:active {
            transform: scale(0.985);
            background: #20242b;
        }

        .icon-wrap {
            position: relative;
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            overflow: hidden;
            border-radius: 13px;
            background: var(--brand);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-wrap img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .fallback-icon {
            display: none;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
        }

        .link-info {
            min-width: 0;
            flex: 1;
        }

        .link-name {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 15px;
            font-weight: 700;
        }

        .link-domain {
            margin-top: 3px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            color: #6f7580;
            font-size: 11px;
        }

        .favorite-btn {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            border-radius: 13px;
            background: transparent;
            color: #555b66;
            font-size: 22px;
        }

        .favorite-btn.active {
            color: #ffd84d;
        }

        .favorite-btn:active {
            transform: scale(0.82);
        }

        /* =========================================================
           BROWSER MODAL
        ========================================================= */

        .browser {
            position: fixed;
            z-index: 1000;
            inset: 0;
            display: none;
            flex-direction: column;
            background: #0d0f12;
            padding-top: env(safe-area-inset-top);
        }

        .browser.open {
            display: flex;
        }

        .browser-bar {
            min-height: 58px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            background: rgba(18,20,24,0.97);
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        .browser-btn {
            height: 42px;
            padding: 0 13px;
            border-radius: 13px;
            background: #20242b;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
        }

        .browser-btn:active {
            transform: scale(0.94);
        }

        .browser-title {
            min-width: 0;
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            color: #8d939e;
            font-size: 12px;
            text-align: center;
        }

        .browser-frame-wrap {
            position: relative;
            flex: 1;
            min-height: 0;
        }

        #browserFrame {
            width: 100%;
            height: 100%;
            border: 0;
            background: #fff;
        }

        .iframe-help {
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 14px;
            z-index: 3;
            display: none;
            padding: 12px;
            border-radius: 15px;
            background: rgba(20,22,27,0.94);
            color: #d9dce1;
            font-size: 12px;
            line-height: 1.4;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
        }

        .iframe-help button {
            margin-top: 8px;
            padding: 9px 13px;
            border-radius: 11px;
            background: #58a6ff;
            color: #08111b;
            font-weight: 800;
        }

        /* =========================================================
           TOAST
        ========================================================= */

        .toast {
            position: fixed;
            z-index: 2000;
            left: 50%;
            bottom: calc(24px + env(safe-area-inset-bottom));
            transform: translate(-50%, 20px);
            max-width: calc(100vw - 40px);
            padding: 11px 15px;
            border-radius: 13px;
            background: rgba(25,28,34,0.96);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition:
                opacity 0.18s ease,
                transform 0.18s ease;
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* =========================================================
           EMPTY STATE
        ========================================================= */

        .empty {
            padding: 30px 15px;
            text-align: center;
            color: #686e79;
        }

        /* =========================================================
           DESKTOP
        ========================================================= */

        @media (min-width: 700px) {
            body {
                padding-left: 24px;
                padding-right: 24px;
            }

            .favorites-grid {
                grid-template-columns: repeat(6, minmax(0, 1fr));
            }

            .search-tools {
                grid-template-columns: 1fr 180px;
            }
        }
    </style>
</head>

            </div>

            <button
                class="yandex-btn"

                aria-label="Copy current link for Yandex"

                🔎
            </button>

         RANDOM
    ========================================================== -->

    <section class="random-card">

        <div class="progress" id="progressText">
            Loading random queue...
        </div>
    </section>


    <!-- =========================================================
         SEARCH
    ========================================================== -->

    <section class="search-panel">

        <div class="search-row">
            <input
                id="searchInput"

                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"

        <div class="search-tools">

            <select
                id="injectSelect"

            >

            </select>

        </div>

    </section>


    <!-- =========================================================
         LINK CONTENT
    ========================================================== -->

    <main id="content"></main>


    <!-- =========================================================
         IN-APP BROWSER
    ========================================================== -->

    <div
        class="browser"
        id="browser"
        aria-hidden="true"
    >

        <div class="browser-bar">

            <button
                class="browser-btn"
                id="browserBack"
            >
                ← Back
            </button>

            <div
                class="browser-title"
                id="browserTitle"
            >
                Link Hub
            </div>

            <button
                class="browser-btn"
                id="browserSafari"
            >
                Safari ↗
            </button>

        </div>

        <div class="browser-frame-wrap">

            <iframe
                id="browserFrame"
                title="Link Hub Browser"
                referrerpolicy="no-referrer"
                allow="autoplay; fullscreen; clipboard-read; clipboard-write"

            <div
                class="iframe-help"

                This website is blocking Link Hub's built-in browser.

                </button>

        </div>

        function loadData() {

            try {

                const savedFavorites =

                if (savedFavorites) {
                    const parsed = JSON.parse(savedFavorites);

                    if (Array.isArray(parsed)) {

                            ALL_LINKS.includes(url)
                        );
                    }
                }

                const savedQueue =
                    localStorage.getItem(STORAGE.queue);

                const savedIndex =
                    localStorage.getItem(STORAGE.index);

                const savedLast =
                    localStorage.getItem(STORAGE.lastOpened);

                if (savedQueue) {

                    const parsedQueue =
                        JSON.parse(savedQueue);

                    if (Array.isArray(parsedQueue)) {
                        shuffledQueue = parsedQueue.filter(url =>
                            ALL_LINKS.includes(url)
                        );
                    }
                }

                if (savedIndex !== null) {
                    currentIndex = Number(savedIndex) || 0;
                }

                if (savedLast) {
                    lastOpenedUrl = savedLast;
                }

            } catch (error) {

                console.warn(
                    "Could not load saved Link Hub data:",
                    error
                );

            }

            if (!Array.isArray(favorites)) {
                favorites = [];
            }

        }

        /* =========================================================
           SHUFFLE
        ========================================================== */

        function shuffleArray(array) {

            const result = [...array];

            for (
                let i = result.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(Math.random() * (i + 1));

                [result[i], result[j]] =
                    [result[j], result[i]];

            }

            return result;
        }


        function ensureQueue() {

            const validQueue =
                shuffledQueue.length === ALL_LINKS.length &&
                ALL_LINKS.every(url =>
                    shuffledQueue.includes(url)
                );

            if (!validQueue) {

                shuffledQueue =
                    shuffleArray(ALL_LINKS);

                currentIndex = 0;

                saveQueue();

            }

            if (
                currentIndex < 0 ||
                currentIndex >= shuffledQueue.length
            ) {

                currentIndex = 0;

                saveQueue();

            }

        }


        function openRandom() {

            ensureQueue();

            const url =
                shuffledQueue[currentIndex];

            currentIndex++;

            if (
                currentIndex >=
                shuffledQueue.length
            ) {

                shuffledQueue =
                    shuffleArray(ALL_LINKS);

                currentIndex = 0;

            }

            saveQueue();

            updateProgress();

            openInHub(url);

        }


        function updateProgress() {

            if (!shuffledQueue.length) {
                progressText.textContent =
                    "Random queue ready";

            const shownIndex =

                    shuffledQueue.length
                );

            progressText.textContent =
                `Random progress: ${shownIndex} / ${shuffledQueue.length}`;

        }


        /* =========================================================

        ========================================================== */

        function getSiteMeta(url) {

            try {

                const parsed = new URL(url);

                const host =
                    parsed.hostname
                        .toLowerCase()
                        .replace(/^www\./, "");

                const path =
                    parsed.pathname.toLowerCase();

                /*
                    IMPORTANT:
                    Check the special nHentai category BEFORE
                    the general nhentai.net entry.
                */

                if (
                    host === "nhentai.net" &&
                    path.startsWith("/category/doujinshi")
                ) {

                    return NHENTAI_CATEGORY_META;

                }

                if (SITE_META[host]) {
                    return SITE_META[host];
                }

            } catch (error) {
                // Fall through to fallback.
            }

            return {
                name: getFallbackName(url),
                color: "#58a6ff",
                icon: null
            };

        }


        function getFallbackName(url) {

            try {

                const parsed = new URL(url);

                return parsed.hostname
                    .replace(/^www\./, "");

            } catch (error) {

                return "Website";

            }

        }


        function getDomain(url) {

            try {

                return new URL(url)
                    .hostname
                    .replace(/^www\./, "");

            } catch (error) {

                return "";

            }

        }


        /* =========================================================
           ICON CREATION
        ========================================================== */

        function createIcon(url, sizeClass = "") {

            const meta = getSiteMeta(url);

            const wrap =
                document.createElement("div");

            wrap.className =
                `icon-wrap ${sizeClass}`;

            wrap.style.setProperty(
                "--brand",
                meta.color
            );

            if (meta.icon) {

                const img =
                    document.createElement("img");

                img.src = meta.icon;

                img.alt = "";

                img.loading = "lazy";

                img.decoding = "async";

                img.referrerPolicy = "no-referrer";

                const fallback =
                    document.createElement("div");

                fallback.className =
                    "fallback-icon";

                fallback.textContent =
                    getFallbackLetter(meta.name);

                img.addEventListener(
                    "error",
                    () => {

                        img.style.display = "none";

                        fallback.style.display =
                            "flex";

                    },
                    { once: true }
                );

                wrap.appendChild(img);
                wrap.appendChild(fallback);

            } else {

                const fallback =
                    document.createElement("div");

                fallback.className =
                    "fallback-icon";

                fallback.style.display =
                    "flex";

                fallback.textContent =
                    getFallbackLetter(meta.name);

                wrap.appendChild(fallback);

            }

            return wrap;

        }


        function getFallbackLetter(name) {

            if (!name) {
                return "🌐";
            }

            return name
                .trim()
                .charAt(0)
                .toUpperCase();

        }

        /* =========================================================
           THE IMPORTANT PART:
           OPEN INSIDE THE PWA
        ========================================================== */

        function openInHub(url) {

            if (!url) {
                return;
            }

            lastOpenedUrl = url;

            localStorage.setItem(
                STORAGE.lastOpened,
                url
            );

            const meta =
                getSiteMeta(url);

            browserTitle.textContent =
                meta.name;

            /*
                IMPORTANT:
                We do NOT use window.open(url).
                We do NOT assign window.location.
                
                The URL goes into the iframe instead.
                This keeps the Link Hub page itself alive.
            */

            iframeHelp.style.display =
                "none";

            browserFrame.src = "about:blank";

            /*
                Small delay prevents some iOS WebKit weirdness
                when rapidly switching iframe sources.
            */

            requestAnimationFrame(() => {

                browserFrame.src = url;

            });

            browser.classList.add("open");

            browser.setAttribute(
                "aria-hidden",
                "false"
            );

            document.body.style.overflow =
                "hidden";

        }


        /* =========================================================
           CLOSE IN-APP BROWSER
        ========================================================== */

        function closeBrowser() {

            browser.classList.remove("open");

            browser.setAttribute(
                "aria-hidden",
                "true"
            );

            document.body.style.overflow =
                "";

            /*
                Clear iframe so the external page stops running
                while the browser is closed.
            */

            browserFrame.src =
                "about:blank";

            iframeHelp.style.display =
                "none";

        }

           This is intentionally the ONLY normal way to leave
           the PWA from a link.
        ========================================================== */

        function openCurrentInSafari() {

            if (!lastOpenedUrl) {
                return;
            }

            /*
                On iPhone this may hand the URL to the appropriate
                installed app because iOS controls external links.
                
                That's intentional here because the user explicitly
                pressed "Safari ↗".
            */

            window.open(
                lastOpenedUrl,
                "_blank",
                "noopener,noreferrer"
            );

        }


        /* =========================================================
           SEARCH
        ========================================================== */

        function performGlobalSearch() {

            const query =
                searchInput.value.trim();

            if (!query) {
                return;
            }

            if (looksLikeUrl(query)) {

                let url = query;

                if (
                    !url.startsWith("http://") &&
                    !url.startsWith("https://")
                ) {

                    url =
                        "https://" + url;

                }

                openInHub(url);

                return;
            }

            const googleUrl =
                "https://www.google.com/search?q=" +
                encodeURIComponent(query);

            openInHub(googleUrl);

        }


        function looksLikeUrl(value) {

            return (
                /^https?:\/\//i.test(value) ||
                /^www\./i.test(value) ||
                /^[a-z0-9.-]+\.[a-z]{2,}(\/|$)/i.test(value)
            );

        }


        /* =========================================================
           SEARCH TARGET DROPDOWN
        ========================================================== */

        function buildSearchOptions() {

            SEARCH_TARGETS.forEach(target => {

                const option =
                    document.createElement("option");

                option.value =
                    target.url;

                option.textContent =
                    target.name;

                injectSelect.appendChild(
                    option
                );

            });

        }


        function performQuickSearch() {

            const query =
                searchInput.value.trim();

            const base =
                injectSelect.value;

            if (!query || !base) {
                return;
            }

            const target =
                SEARCH_TARGETS.find(
                    item => item.url === base
                );

            if (!target) {
                return;
            }

            const url =
                target.url +
                encodeURIComponent(query);

            openInHub(url);

        }

        /* =========================================================
           HTML ESCAPE
        ========================================================== */

        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }

                /*
                    Some blocked pages still trigger "load",
                    so we don't automatically show the warning.
                    The user can use Safari whenever the page
                    clearly refuses to appear.
                */

            }
        );

    </script>

</body>
