<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Link Hub</title>

    <!-- iPhone / PWA Config -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Link Hub">
    <meta name="theme-color" content="#0d1117">

    <!-- Inline Web App Manifest -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
        %22name%22:%22Link%20Hub%22,
        %22short_name%22:%22Hub%22,
        %22start_url%22:%22./%22,
        %22display%22:%22standalone%22,
        %22background_color%22:%22%230d1117%22,
        %22theme_color%22:%22%230d1117%22
    }">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont,
                "SF Pro Text", "SF Pro Icons", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        header {
            background: #161b22;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            z-index: 5;
        }

        header h1 {
            color: #f0f6fc;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .header-right {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-pill {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 6px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #58a6ff;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-pill:active {
            transform: scale(0.96);
        }

        .count {
            color: #8b949e;
        }

        .random-section {
            background: #161b22;
            padding: 12px 16px;
            border-bottom: 1px solid #30363d;
        }

        .random-button {
            width: 100%;
            background: linear-gradient(135deg, #238636, #2ea043);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
            transition: transform 0.1s ease;
        }

        .random-button:active {
            transform: scale(0.97);
        }

        .progress {
            margin-top: 6px;
            text-align: center;
            color: #8b949e;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .search-section {
            background: #161b22;
            padding: 10px 16px 12px;
            border-bottom: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 10px 14px;
            color: #c9d1d9;
            font-size: 0.9rem;
            outline: none;
        }

        .search-input:focus {
            border-color: #58a6ff;
        }

        .search-select {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 0 10px;
            color: #58a6ff;
            font-size: 0.8rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            max-width: 145px;
        }

        .btn-inject {
            background: #238636;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-inject:active {
            transform: scale(0.96);
        }

        .links {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .category-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0 4px;
        }

        .link-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition:
                background-color 0.15s ease,
                border-color 0.15s ease;
        }

        .link-card:active {
            background: #21262d;
            border-color: #58a6ff;
            transform: scale(0.99);
        }

        .link-card.favorite {
            background: #1a1f29;
            border-color: #d29922;
        }

        .link-info {
            min-width: 0;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .link-icon {
            font-size: 1rem;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .link-text-container {
            min-width: 0;
            flex: 1;
        }

        .link-name {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-number {
            color: #8b949e;
            font-size: 0.65rem;
            margin-top: 1px;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: 6px;
        }

        .btn-action {
            background: #21262d;
            border: 1px solid #30363d;
            color: #58a6ff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 600;
            pointer-events: none;
        }

        .favorite-button {
            background: transparent;
            border: none;
            color: #484f58;
            font-size: 1.3rem;
            padding: 2px 6px;
            cursor: pointer;
        }

        .favorite-button.active {
            color: #e3b341;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            z-index: 10;
        }

        .overlay.open {
            display: block;
        }

        .history-drawer {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 55vh;
            background: #161b22;
            border-top: 1px solid #30363d;
            border-radius: 24px 24px 0 0;
            transform: translateY(100%);
            transition:
                transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            z-index: 11;
            display: flex;
            flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .history-drawer.open {
            transform: translateY(0);
        }

        .history-header {
            padding: 14px 18px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-header h2 {
            color: #f0f6fc;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .close-button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid #30363d;
            background: #21262d;
            color: #c9d1d9;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .empty {
            color: #8b949e;
            text-align: center;
            margin-top: 30px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>

<header>
    <h1>Link Hub</h1>

    <div class="header-right">
        <!-- Attempts to launch Yandex Browser -->
        <button class="btn-pill" onclick="openYandex()">
            🟡 Yandex
        </button>

        <button class="btn-pill" onclick="toggleHistory()">
            🕒 History
        </button>

        <span class="count btn-pill" id="linkCount">
            0 Links
        </span>
    </div>
</header>

<section class="random-section">
    <button class="random-button" onclick="openRandomLink()">
        🎲 Open Random Link
    </button>

    <div class="progress" id="progress">
        Loading...
    </div>
</section>

<div class="search-section">

    <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="Filter links..."
        oninput="filterLinks(this.value)"
    >

    <div class="search-row">

        <input
            type="text"
            class="search-input"
            id="injectInput"
            placeholder="Search term to inject..."
            onkeypress="handleInjectKey(event)"
        >

        <select
            class="search-select"
            id="injectTarget">
        </select>

        <button
            class="btn-inject"
            onclick="injectSearch()">
            Go
        </button>

    </div>
</div>

<main class="links" id="links"></main>

<div
    class="overlay"
    id="overlay"
    onclick="toggleHistory()">
</div>

<section
    class="history-drawer"
    id="historyDrawer">

    <div class="history-header">
        <h2>Recent Links</h2>

        <button
            class="close-button"
            onclick="toggleHistory()">
            ✕
        </button>
    </div>

    <div
        class="history-list"
        id="historyList">
    </div>

</section>

<script>

    /*
     * ============================================================
     * YANDEX BROWSER
     * ============================================================
     *
     * This is a custom URL scheme.
     *
     * iOS may hand this URL to Yandex Browser if the app has
     * registered the scheme.
     *
     * IMPORTANT:
     * A webpage cannot force iOS to open another application.
     */

    const YANDEX_LOCAL_URL =
        "yandexbrowser-local://4a4ed72c-c2e5-443a-9127-7911b23d96c1/index.html";


    /*
     * ============================================================
     * CATEGORIES
     * ============================================================
     */

    const CATEGORIES = [

        {
            name: "Core Apps",
            color: "#238636",
            icon: "⚡",

            links: [
                "https://www.reddit.com/",
                "https://x.com/",
                "https://discord.com/",
                "https://www.tiktok.com/en/",
                "https://www.instagram.com/?hl=en",
                "https://mega.nz/login"
            ]
        },

        {
            name: "Lesser Used Apps",
            color: "#58a6ff",
            icon: "🚀",

            links: [
                "https://bsky.app/",
                "https://www.pixiv.net/en/",
                "https://www.threads.com/?hl=en",
                "https://www.deviantart.com/",
                "https://www.tumblr.com/",
                "https://grok.com/imagine"
            ]
        },

        /*
         * ========================================================
         * AI CHAT BOTS
         * ========================================================
         */

        {
            name: "AI Chat Bots",
            color: "#a371f7",
            icon: "🤖",

            links: [
                "https://chatgpt.com/",
                "https://gemini.google.com/",
                "https://janitorai.com/"
            ]
        },

        {
            name: "Story Websites",
            color: "#db6d28",
            icon: "📖",

            links: [
                "https://archiveofourown.org/",
                "https://www.hentai-foundry.com/site/index",
                "https://www.fanfiction.net/"
            ]
        },

        {
            name: "Random Other Websites",
            color: "#f85149",
            icon: "🎲",

            links: [
                "https://nhentai.net/",
                "https://myhentaicomics.com/",
                "https://myhentaigallery.com/",
                "https://hentaiera.com/",
                "https://doujins.com/",
                "https://e-hentai.org/",
                "https://hitomi.la/",
                "https://www.webtoons.com/en/"
            ]
        },

        {
            name: "Art Sorters",
            color: "#e3b341",
            icon: "🎨",

            links: [
                "https://kurosearch.com/",
                "https://kurozenzen.github.io/r34-react/#/",
                "https://r34.app/"
            ]
        }

    ];


    const ALL_LINKS =
        CATEGORIES.flatMap(cat => cat.links);

    const STORAGE_PREFIX = "linkhub_";

    let shuffledLinks = [];
    let currentIndex = 0;
    let favorites = [];
    let history = [];


    /*
     * ============================================================
     * INITIALIZATION
     * ============================================================
     */

    document.addEventListener("DOMContentLoaded", () => {

        loadData();
        loadShuffle();

        populateInjectDropdown();

        renderLinks();
        renderHistory();

        updateUI();

    });


    /*
     * ============================================================
     * YANDEX LAUNCHER
     * ============================================================
     */

    function openYandex() {

        /*
         * Direct navigation is preferable to window.open()
         * for custom URL schemes on iOS.
         */

        window.location.href = YANDEX_LOCAL_URL;

    }


    /*
     * ============================================================
     * STORAGE
     * ============================================================
     */

    function loadData() {

        try {

            favorites =
                JSON.parse(
                    localStorage.getItem(
                        STORAGE_PREFIX + "fav"
                    )
                ) || [];

            history =
                JSON.parse(
                    localStorage.getItem(
                        STORAGE_PREFIX + "hist"
                    )
                ) || [];

        } catch (e) {

            favorites = [];
            history = [];

        }

    }


    function saveData() {

        try {

            localStorage.setItem(
                STORAGE_PREFIX + "fav",
                JSON.stringify(favorites)
            );

            localStorage.setItem(
                STORAGE_PREFIX + "hist",
                JSON.stringify(history)
            );

        } catch (e) {}

    }


    /*
     * ============================================================
     * SHUFFLE
     * ============================================================
     */

    function loadShuffle() {

        try {

            const q =
                JSON.parse(
                    localStorage.getItem(
                        STORAGE_PREFIX + "queue"
                    )
                );

            const idx =
                Number(
                    localStorage.getItem(
                        STORAGE_PREFIX + "idx"
                    )
                );

            if (
                Array.isArray(q) &&
                q.length === ALL_LINKS.length &&
                !isNaN(idx)
            ) {

                shuffledLinks = q;
                currentIndex = idx;

                return;

            }

        } catch (e) {}

        createShuffle();

    }


    function saveShuffle() {

        try {

            localStorage.setItem(
                STORAGE_PREFIX + "queue",
                JSON.stringify(shuffledLinks)
            );

            localStorage.setItem(
                STORAGE_PREFIX + "idx",
                currentIndex
            );

        } catch (e) {}

    }


    function createShuffle() {

        shuffledLinks = [...ALL_LINKS];

        for (
            let i = shuffledLinks.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    Math.random() * (i + 1)
                );

            [
                shuffledLinks[i],
                shuffledLinks[j]
            ] = [
                shuffledLinks[j],
                shuffledLinks[i]
            ];

        }

        currentIndex = 0;

        saveShuffle();

    }


    /*
     * ============================================================
     * SEARCH DROPDOWN
     * ============================================================
     */

    function populateInjectDropdown() {

        const select =
            document.getElementById("injectTarget");

        select.innerHTML = "";

        ALL_LINKS.forEach(url => {

            const option =
                document.createElement("option");

            option.value = url;

            option.textContent =
                getCleanName(url);

            select.appendChild(option);

        });

    }


    /*
     * ============================================================
     * OPEN LINK
     * ============================================================
     */

    function launchLink(url, event) {

        if (event) {
            event.stopPropagation();
        }

        addToHistory(url);

        updateUI();

        /*
         * Opening a new window preserves the behavior
         * of your original version.
         */

        const newWindow = window.open();

        if (newWindow) {

            newWindow.opener = null;
            newWindow.location = url;

        } else {

            window.open(url, "_blank");

        }

    }


    /*
     * ============================================================
     * RANDOM LINK
     * ============================================================
     */

    function openRandomLink() {

        if (ALL_LINKS.length === 0) {
            return;
        }

        if (currentIndex >= shuffledLinks.length) {
            createShuffle();
        }

        const url =
            shuffledLinks[currentIndex++];

        saveShuffle();

        launchLink(url);

    }


    /*
     * ============================================================
     * FAVORITES
     * ============================================================
     */

    function toggleFavorite(url, event) {

        if (event) {
            event.stopPropagation();
        }

        const idx =
            favorites.indexOf(url);

        if (idx > -1) {

            favorites.splice(idx, 1);

        } else {

            favorites.push(url);

        }

        saveData();

        renderLinks();

        filterLinks(
            document.getElementById(
                "searchInput"
            ).value
        );

    }


    /*
     * ============================================================
     * HISTORY
     * ============================================================
     */

    function addToHistory(url) {

        history =
            history.filter(
                item => item !== url
            );

        history.unshift(url);

        if (history.length > 10) {
            history.pop();
        }

        saveData();

        renderHistory();

    }


    /*
     * ============================================================
     * FILTER
     * ============================================================
     */

    function filterLinks(query) {

        const term =
            query.toLowerCase().trim();

        const groups =
            document.querySelectorAll(
                ".category-group"
            );

        groups.forEach(group => {

            const cards =
                group.querySelectorAll(
                    ".link-card"
                );

            let visibleCount = 0;

            cards.forEach(card => {

                const name =
                    card.querySelector(
                        ".link-name"
                    ).textContent.toLowerCase();

                if (
                    name.includes(term) ||
                    term === ""
                ) {

                    card.style.display = "flex";
                    visibleCount++;

                } else {

                    card.style.display = "none";

                }

            });

            if (
                visibleCount === 0 &&
                term !== ""
            ) {

                group.style.display = "none";

            } else {

                group.style.display = "flex";

            }

        });

    }


    /*
     * ============================================================
     * SEARCH INJECTION
     * ============================================================
     */

    function injectSearch() {

        const input =
            document.getElementById(
                "injectInput"
            );

        const select =
            document.getElementById(
                "injectTarget"
            );

        const query =
            input.value.trim();

        if (!query) {
            return;
        }

        const targetUrl = select.value;

        let finalUrl = targetUrl;


        /*
         * ARCHIVE OF OUR OWN
         */

        if (
            targetUrl.includes(
                "archiveofourown.org"
            )
        ) {

            finalUrl =
                `https://archiveofourown.org/works/search?work_search[query]=${encodeURIComponent(query)}`;

        }


        /*
         * KUROSEARCH
         */

        else if (
            targetUrl.includes(
                "kurosearch.com"
            )
        ) {

            finalUrl =
                `https://kurosearch.com/?q=${encodeURIComponent(query)}`;

        }


        /*
         * REDDIT
         */

        else if (
            targetUrl.includes(
                "reddit.com"
            )
        ) {

            finalUrl =
                `https://www.reddit.com/search/?q=${encodeURIComponent(query)}`;

        }


        /*
         * PIXIV
         */

        else if (
            targetUrl.includes(
                "pixiv.net"
            )
        ) {

            finalUrl =
                `https://www.pixiv.net/en/tags/${encodeURIComponent(query)}`;

        }


        /*
         * X / TWITTER
         */

        else if (
            targetUrl.includes(
                "x.com"
            )
        ) {

            finalUrl =
                `https://x.com/search?q=${encodeURIComponent(query)}`;

        }


        /*
         * CHATGPT
         */

        else if (
            targetUrl.includes(
                "chatgpt.com"
            )
        ) {

            /*
             * ChatGPT does not need a normal ?q=
             * URL for starting a conversation.
             *
             * Using the search-style URL is not guaranteed
             * to create a prompt, so we simply open ChatGPT.
             */

            finalUrl =
                "https://chatgpt.com/";

        }


        /*
         * GEMINI
         */

        else if (
            targetUrl.includes(
                "gemini.google.com"
            )
        ) {

            /*
             * Gemini's web interface does not provide
             * a universally reliable public URL format
             * for injecting a prompt.
             */

            finalUrl =
                "https://gemini.google.com/";

        }


        /*
         * JANITOR AI
         */

        else if (
            targetUrl.includes(
                "janitorai.com"
            )
        ) {

            finalUrl =
                `https://janitorai.com/search?query=${encodeURIComponent(query)}`;

        }


        /*
         * GENERIC FALLBACK
         */

        else {

            const separator =
                targetUrl.includes("?")
                    ? "&"
                    : "?";

            finalUrl =
                `${targetUrl}${separator}q=${encodeURIComponent(query)}`;

        }


        launchLink(finalUrl);

        input.value = "";

    }


    function handleInjectKey(event) {

        if (event.key === "Enter") {
            injectSearch();
        }

    }


    /*
     * ============================================================
     * ICONS
     * ============================================================
     */

    function getSiteIcon(url) {

        if (url.includes("reddit.com")) return "👽";
        if (url.includes("x.com")) return "✖️";
        if (url.includes("discord.com")) return "💬";
        if (url.includes("tiktok.com")) return "🎵";
        if (url.includes("instagram.com")) return "📷";
        if (url.includes("mega.nz")) return "☁️";

        if (url.includes("bsky.app")) return "🦋";
        if (url.includes("pixiv.net")) return "🎨";
        if (url.includes("threads.com")) return "🧵";
        if (url.includes("deviantart.com")) return "🖼️";
        if (url.includes("tumblr.com")) return "📝";
        if (url.includes("grok.com")) return "✨";

        if (url.includes("chatgpt.com")) return "🟢";
        if (url.includes("gemini.google.com")) return "🔵";
        if (url.includes("janitorai.com")) return "🤖";

        if (url.includes("archiveofourown.org")) return "📖";
        if (url.includes("hentai-foundry.com")) return "📜";
        if (url.includes("fanfiction.net")) return "📚";

        if (url.includes("nhentai.net")) return "🐙";
        if (url.includes("myhentaicomics.com")) return "💬";
        if (url.includes("myhentaigallery.com")) return "🖼️";
        if (url.includes("hentaiera.com")) return "🌸";
        if (url.includes("doujins.com")) return "📖";
        if (url.includes("e-hentai.org")) return "🐼";
        if (url.includes("hitomi.la")) return "🎨";
        if (url.includes("webtoons.com")) return "📱";

        if (url.includes("kurosearch.com")) return "🔍";
        if (url.includes("r34")) return "⚡";

        return "🌐";

    }


    /*
     * ============================================================
     * RENDER LINKS
     * ============================================================
     */

    function renderLinks() {

        const container =
            document.getElementById("links");

        container.innerHTML = "";


        /*
         * FAVORITES
         */

        const favs =
            ALL_LINKS.filter(
                u => favorites.includes(u)
            );

        if (favs.length > 0) {

            const favGroup =
                document.createElement("div");

            favGroup.className =
                "category-group";

            favGroup.innerHTML =
                `<div class="category-header" style="color:#e3b341;">
                    ⭐ Favorites (${favs.length})
                </div>`;

            favs.forEach(u => {

                favGroup.appendChild(
                    createCard(
                        u,
                        ALL_LINKS.indexOf(u) + 1,
                        "#e3b341"
                    )
                );

            });

            container.appendChild(favGroup);

        }


        /*
         * NORMAL CATEGORIES
         */

        CATEGORIES.forEach(cat => {

            const group =
                document.createElement("div");

            group.className =
                "category-group";


            const header =
                document.createElement("div");

            header.className =
                "category-header";

            header.style.color =
                cat.color;

            header.innerHTML =
                `${cat.icon} ${cat.name} (${cat.links.length})`;

            group.appendChild(header);


            cat.links.forEach(u => {

                group.appendChild(
                    createCard(
                        u,
                        ALL_LINKS.indexOf(u) + 1,
                        cat.color
                    )
                );

            });


            container.appendChild(group);

        });

    }


    /*
     * ============================================================
     * CREATE LINK CARD
     * ============================================================
     */

    function createCard(url, num, color) {

        const card =
            document.createElement("div");

        const isFav =
            favorites.includes(url);

        card.className =
            "link-card" +
            (isFav ? " favorite" : "");


        const icon =
            getSiteIcon(url);


        /*
         * Build DOM safely instead of injecting
         * the URL directly into onclick HTML.
         */

        const info =
            document.createElement("div");

        info.className =
            "link-info";


        const iconElement =
            document.createElement("span");

        iconElement.className =
            "link-icon";

        iconElement.style.backgroundColor =
            color + "22";

        iconElement.style.color =
            color;

        iconElement.textContent =
            icon;


        const textContainer =
            document.createElement("div");

        textContainer.className =
            "link-text-container";


        const name =
            document.createElement("div");

        name.className =
            "link-name";

        name.style.color =
            color;

        name.textContent =
            getCleanName(url);


        const number =
            document.createElement("div");

        number.className =
            "link-number";

        number.textContent =
            `Site #${num}`;


        textContainer.appendChild(name);
        textContainer.appendChild(number);

        info.appendChild(iconElement);
        info.appendChild(textContainer);


        /*
         * ACTIONS
         */

        const actions =
            document.createElement("div");

        actions.className =
            "actions";


        const openButton =
            document.createElement("button");

        openButton.className =
            "btn-action";

        openButton.textContent =
            "Open";


        const favoriteButton =
            document.createElement("button");

        favoriteButton.className =
            "favorite-button" +
            (isFav ? " active" : "");

        favoriteButton.textContent =
            "★";


        favoriteButton.addEventListener(
            "click",
            event => {
                toggleFavorite(url, event);
            }
        );


        actions.appendChild(openButton);
        actions.appendChild(favoriteButton);


        card.appendChild(info);
        card.appendChild(actions);


        card.addEventListener(
            "click",
            event => {
                launchLink(url, event);
            }
        );


        return card;

    }


    /*
     * ============================================================
     * HISTORY
     * ============================================================
     */

    function renderHistory() {

        const container =
            document.getElementById(
                "historyList"
            );

        container.innerHTML = "";


        if (history.length === 0) {

            container.innerHTML =
                '<p class="empty">No recent links opened.</p>';

            return;

        }


        history.forEach((url, i) => {

            const card =
                document.createElement("div");

            card.className =
                "link-card";


            const info =
                document.createElement("div");

            info.className =
                "link-info";


            const icon =
                document.createElement("span");

            icon.className =
                "link-icon";

            icon.style.backgroundColor =
                "#58a6ff22";

            icon.style.color =
                "#58a6ff";

            icon.textContent =
                getSiteIcon(url);


            const text =
                document.createElement("div");

            text.className =
                "link-text-container";


            const name =
                document.createElement("div");

            name.className =
                "link-name";

            name.style.color =
                "#58a6ff";

            name.textContent =
                getCleanName(url);


            const number =
                document.createElement("div");

            number.className =
                "link-number";

            number.textContent =
                `Recent #${i + 1}`;


            text.appendChild(name);
            text.appendChild(number);

            info.appendChild(icon);
            info.appendChild(text);


            const actions =
                document.createElement("div");

            actions.className =
                "actions";


            const button =
                document.createElement("button");

            button.className =
                "btn-action";

            button.textContent =
                "Open";


            actions.appendChild(button);


            card.appendChild(info);
            card.appendChild(actions);


            card.addEventListener(
                "click",
                event => {
                    launchLink(url, event);
                }
            );


            container.appendChild(card);

        });

    }


    /*
     * ============================================================
     * HELPERS
     * ============================================================
     */

    function getCleanName(url) {

        try {

            return new URL(url)
                .hostname
                .replace(/^www\./, "");

        } catch (e) {

            return url;

        }

    }


    function updateUI() {

        document.getElementById(
            "linkCount"
        ).textContent =
            `${ALL_LINKS.length} Links`;


        document.getElementById(
            "progress"
        ).textContent =
            `Progress: ${currentIndex} / ${ALL_LINKS.length}`;

    }


    function toggleHistory() {

        document
            .getElementById("historyDrawer")
            .classList.toggle("open");

        document
            .getElementById("overlay")
            .classList.toggle("open");

    }

</script>
