<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Link Hub</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Link Hub">
<meta name="theme-color" content="#0b0d10">
<style>
/* =========================================================
   LINK HUB
   Everything is contained in this one file.
   ========================================================= */
:root {
    --bg: #0b0d10;
    --surface: #12161b;
    --surface-2: #181d23;
    --border: #272e36;
    --text: #f1f3f5;
    --muted: #89919b;
    --green: #35c759;
    --green-dark: #248a3d;
    --gold: #f5c451;
    --radius: 16px;
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                 "SF Pro Display", sans-serif;
    -webkit-tap-highlight-color: transparent;
}
html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}
body {
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}
/* =========================================================
   HEADER
   ========================================================= */
header {
    flex-shrink: 0;
    height: 52px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(18, 22, 27, .92);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 5;
}
.title {
    display: flex;
    align-items: center;
    gap: 9px;
}
.title-icon {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, #35c759, #248a3d);
    border-radius: 9px;
    font-size: 14px;
    box-shadow: 0 4px 12px rgba(53, 199, 89, .2);
}
header h1 {
    font-size: 17px;
    font-weight: 750;
    letter-spacing: -.02em;
}
.count {
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 650;
}
/* =========================================================
   LINK AREA
   ========================================================= */
.links {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 22px;
}
.category {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.category-title {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 4px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 750;
    letter-spacing: .08em;
    text-transform: uppercase;
}
.category-title .category-icon {
    font-size: 13px;
}
.category-title .category-count {
    opacity: .6;
    font-weight: 600;
}
/* =========================================================
   LINK CARDS
   ========================================================= */
.link-card {
    width: 100%;
    min-height: 58px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition:
        transform .12s ease,
        background .12s ease,
        border-color .12s ease;
}
.link-card:active {
    transform: scale(.975);
    background: var(--surface-2);
}
.link-main {
    min-width: 0;
    flex: 1;
    display: flex;
    align-items: center;
    gap: 11px;
}
/* Small site icon */
.site-icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: 11px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: -.02em;
    background: color-mix(in srgb, var(--site-color) 13%, transparent);
    color: var(--site-color);
    border: 1px solid color-mix(in srgb, var(--site-color) 20%, transparent);
}
.link-name {
    min-width: 0;
    color: var(--text);
    font-size: 15px;
    font-weight: 650;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.link-url {
    margin-top: 2px;
    color: var(--muted);
    font-size: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
/* =========================================================
   CARD ACTIONS
   ========================================================= */
.card-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
}
.open-label {
    color: var(--muted);
    font-size: 10px;
    font-weight: 650;
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 6px 8px;
    border-radius: 8px;
}
.favorite-button {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    background: transparent;
    border: none;
    color: #555e68;
    font-size: 18px;
    cursor: pointer;
}
.favorite-button.active {
    color: var(--gold);
}
/* =========================================================
   FAVORITES
   ========================================================= */
.favorite-card {
    background:
        linear-gradient(
            135deg,
            rgba(245, 196, 81, .07),
            transparent 60%
        ),
        var(--surface);
    border-color: rgba(245, 196, 81, .3);
}
.favorite-card .site-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
}
.favorite-card .link-name {
    font-size: 16px;
}
/* =========================================================
   BOTTOM CONTROL PANEL
   ========================================================= */
.control-panel {
    flex-shrink: 0;
    padding: 10px 14px 12px;
    background: rgba(18, 22, 27, .96);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    z-index: 5;
}
/* Random */
.random-row {
    display: flex;
    align-items: center;
    gap: 10px;
}
.random-button {
    flex: 1;
    height: 48px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #35c759, #248a3d);
    color: white;
    font-size: 15px;
    font-weight: 750;
    box-shadow: 0 6px 18px rgba(53, 199, 89, .18);
    cursor: pointer;
}
.random-button:active {
    transform: scale(.97);
}
.progress {
    min-width: 55px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 650;
    text-align: right;
}
/* Search */
.search-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
}
.search-input,
.search-select {
    height: 38px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    outline: none;
}
.search-input {
    min-width: 0;
    flex: 1;
    padding: 0 11px;
    border-radius: 10px;
    font-size: 13px;
}
.search-input::placeholder {
    color: #626b75;
}
.search-input:focus,
.search-select:focus {
    border-color: rgba(53, 199, 89, .65);
}
.search-select {
    max-width: 105px;
    padding: 0 7px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 650;
}
.go-button {
    height: 38px;
    padding: 0 13px;
    border: none;
    border-radius: 10px;
    background: var(--green-dark);
    color: white;
    font-size: 12px;
    font-weight: 750;
    cursor: pointer;
}
/* Bottom buttons */
.bottom-nav {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 8px;
}
.nav-button {
    height: 32px;
    padding: 0 11px;
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: #b7bec7;
    font-size: 11px;
    font-weight: 650;
    cursor: pointer;
}
.nav-button:active {
    transform: scale(.95);
}
/* =========================================================
   OVERLAY
   ========================================================= */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .62);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 10;
}
.overlay.open {
    opacity: 1;
    pointer-events: auto;
}
/* =========================================================
   HISTORY DRAWER
   ========================================================= */
.history-drawer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: min(58vh, 560px);
    display: flex;
    flex-direction: column;
    background: #12161b;
    border-top: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.2, .9, .2, 1);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 11;
}
.history-drawer.open {
    transform: translateY(0);
}
.drawer-handle {
    width: 38px;
    height: 4px;
    margin: 8px auto 2px;
    background: #3a424c;
    border-radius: 10px;
}
.history-header {
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
}
.history-header h2 {
    font-size: 15px;
    font-weight: 750;
}
.close-button {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
}
.history-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.empty {
    color: var(--muted);
    text-align: center;
    padding-top: 40px;
    font-size: 12px;
}
/* =========================================================
   BROWSER MODAL
   ========================================================= */
.browser-modal {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    background: var(--bg);
    z-index: 100;
}
.browser-modal.open {
    display: flex;
}
.browser-header {
    min-height: 52px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
}
.browser-url {
    min-width: 0;
    flex: 1;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.browser-actions {
    display: flex;
    gap: 5px;
}
.browser-button {
    height: 32px;
    padding: 0 9px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface-2);
    color: #c4cad1;
    font-size: 10px;
    font-weight: 700;
    white-space: nowrap;
}
.browser-body {
    flex: 1;
    width: 100%;
    border: none;
    background: white;
}
/* =========================================================
   TOAST
   ========================================================= */
.toast {
    position: fixed;
    left: 50%;
    bottom: 105px;
    transform: translate(-50%, 20px);
    max-width: calc(100% - 40px);
    padding: 10px 15px;
    background: #20262d;
    border: 1px solid #343c45;
    border-radius: 14px;
    color: white;
    font-size: 11px;
    font-weight: 650;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
    opacity: 0;
    pointer-events: none;
    transition: all .25s ease;
    z-index: 110;
}
.toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}
/* =========================================================
   SMALL PHONES
   ========================================================= */
@media (max-height: 650px) {
    .links {
        padding-top: 12px;
        gap: 16px;
    }
    .link-card {
        min-height: 52px;
    }
    .site-icon {
        width: 32px;
        height: 32px;
    }
    .control-panel {
        padding-top: 7px;
    }
    .random-button {
        height: 44px;
    }
}
</style>
</head>

        class="browser-body"
        id="browserIframe"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
    ></iframe>
</div>
<!-- Toast -->
<div class="toast" id="toast"></div>

];
/* =========================================================
   STATE
   ========================================================= */
const STORAGE = "linkhub_thumb_";
const ALL_LINKS = CATEGORIES.flatMap(category => category.links);
let favorites = [];
let history = [];
let shuffledLinks = [];
let currentIndex = 0;
let activeBrowserUrl = "";
/* =========================================================
   ELEMENTS
   ========================================================= */
const $ = id => document.getElementById(id);
/* =========================================================
   STARTUP
   ========================================================= */
document.addEventListener("DOMContentLoaded", () => {
    loadData();
    loadShuffle();
    populateSearch();
    renderLinks();
    renderHistory();
    updateUI();
});
/* =========================================================
   STORAGE
   ========================================================= */
function loadData() {
    try {
        favorites = JSON.parse(
            localStorage.getItem(STORAGE + "fav")
        ) || [];
        history = JSON.parse(
            localStorage.getItem(STORAGE + "hist")
        ) || [];
    } catch {
        favorites = [];
        history = [];
    }
}
function saveData() {
    try {
        localStorage.setItem(
            STORAGE + "fav",
            JSON.stringify(favorites)
        );
        localStorage.setItem(
            STORAGE + "hist",
            JSON.stringify(history)
        );
    } catch {}
}
/* =========================================================
   RANDOM QUEUE
   ========================================================= */
function loadShuffle() {
    try {
        const queue = JSON.parse(
            localStorage.getItem(STORAGE + "queue")
        );
        const index = Number(
            localStorage.getItem(STORAGE + "idx")
        );
        if (
            Array.isArray(queue) &&
            queue.length === ALL_LINKS.length &&
            queue.every(url =>
                ALL_LINKS.some(link => link.url === url)
            ) &&
            Number.isInteger(index) &&
            index >= 0 &&
            index <= queue.length
        ) {
            shuffledLinks = queue;
            currentIndex = index;
            return;
        }
    } catch {}
    createShuffle();
}
function saveShuffle() {
    try {
        localStorage.setItem(
            STORAGE + "queue",
            JSON.stringify(shuffledLinks)
        );
        localStorage.setItem(
            STORAGE + "idx",
            currentIndex
        );
    } catch {}
}
function createShuffle() {
    shuffledLinks = ALL_LINKS.map(link => link.url);
    for (let i = shuffledLinks.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledLinks[i], shuffledLinks[j]] =
            [shuffledLinks[j], shuffledLinks[i]];
    }
    currentIndex = 0;
    saveShuffle();
}
/* =========================================================
   RANDOM LINK
   ========================================================= */

    if (!ALL_LINKS.length) return;
    if (currentIndex >= shuffledLinks.length) {
        createShuffle();
    }
    const url = shuffledLinks[currentIndex];
    currentIndex++;
    saveShuffle();
    updateUI();
    launchLink(url);
}
/* =========================================================
   FAVORITES
   ========================================================= */
function toggleFavorite(url, event) {
    event.stopPropagation();
    const index = favorites.indexOf(url);
    if (index >= 0) {
        favorites.splice(index, 1);
    } else {
        favorites.push(url);
    }
    saveData();
    renderLinks();
}
/* =========================================================
   HISTORY
   ========================================================= */
function addToHistory(url) {
    history = history.filter(item => item !== url);
    history.unshift(url);
    history = history.slice(0, 10);
    saveData();
    renderHistory();
}
/* =========================================================
   OPEN LINK
   ========================================================= */
function launchLink(url) {
    activeBrowserUrl = url;
    addToHistory(url);
    $("browserUrlText").textContent = getCleanName(url);
    $("browserIframe").src = url;
    $("browserModal").classList.add("open");
}
function closeBrowserModal() {
    $("browserIframe").src = "about:blank";
    $("browserModal").classList.remove("open");
}
function openInExternalSafari() {
    if (!activeBrowserUrl) return;
    window.open(activeBrowserUrl, "_blank");
}
/* =========================================================
   RENDER LINKS
   ========================================================= */
function renderLinks() {
    const container = $("links");
    container.innerHTML = "";
    /* Favorites first */
    const favoriteLinks = ALL_LINKS.filter(link =>
        favorites.includes(link.url)
    );
    if (favoriteLinks.length) {
        const group = document.createElement("section");
        group.className = "category";
        group.appendChild(
            createCategoryHeader(
                "⭐",
                "Favorites",
                favoriteLinks.length,
                "#f5c451"
            )
        );
        favoriteLinks.forEach(link => {
            group.appendChild(
                createCard(link, true)
            );
        });
        container.appendChild(group);
    }
    /* Normal categories */
    CATEGORIES.forEach(category => {
        const links = category.links.filter(link =>
            !favorites.includes(link.url)
        );
        if (!links.length) return;
        const group = document.createElement("section");
        group.className = "category";
        group.appendChild(
            createCategoryHeader(
                category.icon,
                category.name,
                links.length,
                category.color
            )
        );
        links.forEach(link => {
            group.appendChild(
                createCard(link)
            );
        });
        container.appendChild(group);
    });
}
/* =========================================================
   CATEGORY HEADER
   ========================================================= */
function createCategoryHeader(
    icon,
    name,
    count,
    color
) {
    const header = document.createElement("div");
    header.className = "category-title";
    header.style.color = color;
    header.innerHTML = `
        <span class="category-icon">${icon}</span>
        <span>${name}</span>
        <span class="category-count">(${count})</span>
    `;
    return header;
}
/* =========================================================
   CARD
   ========================================================= */
function createCard(link, isFavorite = false) {
    const card = document.createElement("div");
    card.className =
        "link-card" +
        (isFavorite ? " favorite-card" : "");
    card.addEventListener("click", () => {
        launchLink(link.url);
    });
    const main = document.createElement("div");
    main.className = "link-main";
    const icon = document.createElement("div");
    icon.className = "site-icon";
    icon.style.setProperty(
        "--site-color",
        link.color
    );
    icon.textContent = link.icon;
    const text = document.createElement("div");
    text.style.minWidth = "0";
    const name = document.createElement("div");
    name.className = "link-name";
    name.textContent = link.name;
    const url = document.createElement("div");
    url.className = "link-url";
    url.textContent = getCleanName(link.url);
    text.appendChild(name);
    text.appendChild(url);
    main.appendChild(icon);
    main.appendChild(text);
    const actions = document.createElement("div");
    actions.className = "card-actions";
    const openLabel = document.createElement("span");
    openLabel.className = "open-label";
    openLabel.textContent = "Open";
    const favoriteButton = document.createElement("button");
    favoriteButton.className =
        "favorite-button" +
        (isFavorite ? " active" : "");
    favoriteButton.textContent = "★";
    favoriteButton.setAttribute(
        "aria-label",
        isFavorite
            ? "Remove from favorites"
            : "Add to favorites"
    );
    favoriteButton.addEventListener(
        "click",
        event => toggleFavorite(link.url, event)
    );
    actions.appendChild(openLabel);
    actions.appendChild(favoriteButton);
    card.appendChild(main);
    card.appendChild(actions);
    return card;
}
/* =========================================================
   HISTORY
   ========================================================= */
function renderHistory() {
    const container = $("historyList");
    container.innerHTML = "";
    if (!history.length) {
        container.innerHTML =
            `<p class="empty">No recent links opened.</p>`;
        return;
    }
    history.forEach(url => {
        const link = findLink(url);
        const card = document.createElement("div");
        card.className = "link-card";
        const main = document.createElement("div");
        main.className = "link-main";
        const icon = document.createElement("div");
        icon.className = "site-icon";
        icon.style.setProperty(
            "--site-color",
            link?.color || "#58a6ff"
        );
        icon.textContent =
            link?.icon || "↗";
        const text = document.createElement("div");
        text.style.minWidth = "0";
        const name = document.createElement("div");
        name.className = "link-name";
        name.textContent =
            link?.name || getCleanName(url);
        const urlText = document.createElement("div");
        urlText.className = "link-url";
        urlText.textContent = getCleanName(url);
        text.appendChild(name);
        text.appendChild(urlText);
        main.appendChild(icon);
        main.appendChild(text);
        const openLabel = document.createElement("span");
        openLabel.className = "open-label";
        openLabel.textContent = "Open";
        card.appendChild(main);
        card.appendChild(openLabel);
        card.addEventListener("click", () => {
            launchLink(url);
        });
        container.appendChild(card);
    });
}
/* =========================================================
   SEARCH / INJECT
   ========================================================= */
function populateSearch() {
    const select = $("injectTarget");
    select.innerHTML = "";
    const searchable = [
        ["Reddit", "reddit.com"],
        ["X", "x.com"],
        ["AO3", "archiveofourown.org"],
        ["Pixiv", "pixiv.net"],
        ["KuroSearch", "kurosearch.com"],
        ["JanitorAI", "janitorai.com"],
        ["SpicyChat", "spicychat.ai"],
        ["YouTube", "youtube.com"],
        ["Google", "google.com"]
    ];
    searchable.forEach(([name, domain]) => {
        const option =
            document.createElement("option");
        option.value = domain;
        option.textContent = name;
        select.appendChild(option);
    });
}
function injectSearch() {
    const query =
        $("injectInput").value.trim();
    if (!query) return;
    const target =
        $("injectTarget").value;
    const encoded =
        encodeURIComponent(query);
    const searchUrls = {
        "reddit.com":
            `https://www.reddit.com/search/?q=${encoded}`,
        "x.com":
            `https://x.com/search?q=${encoded}`,
        "archiveofourown.org":
            `https://archiveofourown.org/works/search?work_search[query]=${encoded}`,
        "pixiv.net":
            `https://www.pixiv.net/en/tags/${encoded}`,
        "kurosearch.com":
            `https://kurosearch.com/?q=${encoded}`,
        "janitorai.com":
            `https://janitorai.com/search?query=${encoded}`,
        "spicychat.ai":
            `https://spicychat.ai/search?q=${encoded}`,
        "youtube.com":
            `https://www.youtube.com/results?search_query=${encoded}`,
        "google.com":
            `https://www.google.com/search?q=${encoded}`
    };
    launchLink(
        searchUrls[target] ||
        `https://${target}/?q=${encoded}`
    );
    $("injectInput").value = "";
}
/* =========================================================
   YANDEX
   ========================================================= */
function copyYandexUrl() {
    const customUrl =
        "yandexbrowser-local://4a4ed72c-c2e5-443a-9127-7911b23d96c1/index.html";
    navigator.clipboard
        .writeText(customUrl)
        .then(() => {
            showToast(
                "Link copied! Opening Yandex..."
            );
            setTimeout(() => {
                window.location.href =
                    "yandexbrowser://";
            }, 500);
        })
        .catch(() => {
            showToast(
                "Couldn't copy the Yandex link."
            );
        });
}
/* =========================================================
   HISTORY DRAWER
   ========================================================= */
function toggleHistory() {
    $("historyDrawer")
        .classList.toggle("open");
    $("overlay")
        .classList.toggle("open");
}
/* =========================================================
   HELPERS
   ========================================================= */
function findLink(url) {
    return ALL_LINKS.find(
        link => link.url === url
    );
}
function getCleanName(url) {
    try {
        return new URL(url)
            .hostname
            .replace(/^www\./, "");
    } catch {
        return url;
    }
}
function updateUI() {
    $("linkCount").textContent =
        `${ALL_LINKS.length} Links`;
    $("progress").textContent =
        `${currentIndex} / ${ALL_LINKS.length}`;
}
/* =========================================================
   TOAST
   ========================================================= */
let toastTimer;
function showToast(message) {
    const toast = $("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2500);
}
/* =========================================================
   EVENTS
   ========================================================= */
$("randomButton").addEventListener(
    "click",
    openRandomLink
);
$("goButton").addEventListener(
    "click",
    injectSearch
);
$("injectInput").addEventListener(
    "keydown",
    event => {
        if (event.key === "Enter") {
            injectSearch();
        }
    }
);
$("yandexButton").addEventListener(
    "click",
    copyYandexUrl
);
$("historyButton").addEventListener(
    "click",
    toggleHistory
);
$("closeHistory").addEventListener(
    "click",
    toggleHistory
);
$("overlay").addEventListener(
    "click",
    toggleHistory
);
$("closeBrowser").addEventListener(
    "click",
    closeBrowserModal
);
$("safariButton").addEventListener(
    "click",
    openInExternalSafari
);
</script>
