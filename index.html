    }

    body {
        color: #f5f5f5;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "SF Pro Text",
            system-ui,
            sans-serif;

        padding:
            calc(14px + env(safe-area-inset-top))
            14px
            calc(24px + env(safe-area-inset-bottom));
    }

    button,
    input,
    select {
        font: inherit;
    }

    button {
        border: 0;
        cursor: pointer;
    }

    /* =========================================================
       MAIN APP
    ========================================================= */

    #app {
        max-width: 700px;
        margin: auto;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
    }

    h1 {
        margin: 0;
        font-size: 27px;
        font-weight: 800;
        letter-spacing: -0.7px;
    }

    .count {
        margin-top: 3px;
        color: #727781;
        font-size: 12px;
    }

    .yandex {
        width: 43px;
        height: 43px;
        border-radius: 14px;
        background: #1c1f25;
        color: white;
        font-size: 18px;
    }

    .yandex:active {
        transform: scale(.92);
    }

    /* =========================================================
       RANDOM
    ========================================================= */

    .random {
        width: 100%;
        height: 66px;
        margin-bottom: 8px;

        border-radius: 19px;

        background: #1c2026;
        color: white;

        font-size: 18px;
        font-weight: 800;

        box-shadow:
            inset 0 0 0 1px rgba(255,255,255,.06);
    }

    .random:active {
        transform: scale(.985);
    }

    .progress {
        margin-bottom: 14px;
        color: #666c76;
        text-align: center;
        font-size: 11px;
    }

    /* =========================================================
       SEARCH
    ========================================================= */

    .search {
        display: grid;
        grid-template-columns: 1fr 55px;
        gap: 7px;
        margin-bottom: 18px;
    }

    .search input {
        width: 100%;
        height: 45px;

        padding: 0 14px;

        border: 0;
        outline: 0;
        border-radius: 14px;

        background: #191c21;
        color: white;

        box-shadow:
            inset 0 0 0 1px rgba(255,255,255,.06);
    }

    .search input::placeholder {
        color: #666c76;
    }

    .search button {
        border-radius: 14px;
        background: #58a6ff;
        color: #07111a;
        font-weight: 800;
    }

    /* =========================================================
       FAVORITES
    ========================================================= */

    .section {
        margin-bottom: 23px;
    }

    .section-title {
        display: flex;
        justify-content: space-between;
        align-items: center;

        margin: 0 4px 9px;

        color: #949aa5;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .5px;
    }

    .favorites {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 13px;
    }

    .favorite {
        position: relative;

        aspect-ratio: 1 / 1;

        overflow: hidden;

        border-radius: 22%;

        background: #1b1e24;

        box-shadow:
            inset 0 0 0 1px rgba(255,255,255,.08),
            0 7px 20px rgba(0,0,0,.28);
    }

    .favorite:active {
        transform: scale(.92);
    }

    .favorite .icon {
        width: 100%;
        height: 100%;
        border-radius: inherit;
    }

    .favorite .icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .remove-favorite {
        position: absolute;
        top: 5px;
        right: 5px;

        width: 25px;
        height: 25px;

        border-radius: 50%;

        background: rgba(0,0,0,.60);
        color: white;

        font-size: 14px;
        line-height: 25px;

        z-index: 3;
    }

    /* =========================================================
       NORMAL LINKS
    ========================================================= */

    .links {
        display: flex;
        flex-direction: column;
        gap: 7px;
    }

    .link {
        --brand: #58a6ff;

        display: flex;
        align-items: center;

        width: 100%;
        min-height: 65px;

        padding: 8px;

        border-radius: 17px;

        background: #191c21;

        box-shadow:
            inset 0 0 0 1px rgba(255,255,255,.055);

        transition: transform .1s ease;
    }

    .link:active {
        transform: scale(.985);
    }

    /* BIGGER ICON */

    .icon {
        position: relative;

        width: 52px;
        height: 52px;

        flex: 0 0 52px;

        overflow: hidden;

        border-radius: 15px;

        background: var(--brand);

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .icon img {
        display: block;

        width: 100%;
        height: 100%;

        object-fit: cover;
    }

    .fallback {
        display: none;

        width: 100%;
        height: 100%;

        align-items: center;
        justify-content: center;

        color: white;

        font-size: 21px;
        font-weight: 800;
    }

    .link-info {
        min-width: 0;
        flex: 1;

        margin-left: 12px;
    }

    .name {
        overflow: hidden;

        white-space: nowrap;
        text-overflow: ellipsis;

        color: #f4f4f5;

        font-size: 15px;
        font-weight: 700;
    }

    .domain {
        overflow: hidden;

        margin-top: 3px;

        white-space: nowrap;
        text-overflow: ellipsis;

        color: #666c76;

        font-size: 10px;
    }

    .heart {
        width: 43px;
        height: 43px;

        flex: 0 0 43px;

        border-radius: 13px;

        background: transparent;

        color: #555b65;

        font-size: 23px;
    }

    .heart.active {
        color: #ffd84d;
    }

    .heart:active {
        transform: scale(.8);
    }

    /* =========================================================
       WEBSITE VIEW
       
       This takes over the PWA screen.
       No browser toolbar.
       No Back button.
       No Safari button.
    ========================================================= */

    #websiteView {
        position: fixed;
        inset: 0;

        display: none;
        flex-direction: column;

        background: white;

        padding-top: env(safe-area-inset-top);
    }

    #websiteFrame {
        width: 100%;
        height: 100%;

        border: 0;

        background: white;
    }

    #websiteView.open {
        display: flex;
    }

    /* =========================================================
       TOAST
    ========================================================= */

    #toast {
        position: fixed;

        left: 50%;
        bottom: calc(22px + env(safe-area-inset-bottom));

        transform: translate(-50%, 15px);

        padding: 10px 14px;

        border-radius: 12px;

        background: rgba(25,28,34,.96);

        color: white;

        font-size: 12px;
        font-weight: 600;

        opacity: 0;

        pointer-events: none;

        transition:
            opacity .18s ease,
            transform .18s ease;

        z-index: 100;
    }

    #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
    }

    /* =========================================================
       SMALLER PHONES
    ========================================================= */

    @media (max-width: 360px) {

        .favorites {
            gap: 10px;
        }

        .link-info {
            margin-left: 9px;
        }

        .name {
            font-size: 14px;
        }

    }
</style>
</head>

<div id="app">

    <!-- HEADER -->

    <header>

        <div>
            <h1>Link Hub</h1>

</div>

    document.getElementById("progress");

const searchInput =
    document.getElementById("searchInput");

const searchButton =
    document.getElementById("searchButton");

const yandexButton =
    document.getElementById("yandex");

const websiteView =
    document.getElementById("websiteView");

const websiteFrame =
    document.getElementById("websiteFrame");

const toast =
    document.getElementById("toast");


/* =============================================================
   LOAD SAVED DATA
============================================================= */

function loadData() {

    try {

        const savedFavorites =
            JSON.parse(
                localStorage.getItem(
                    STORAGE.favorites
                ) || "[]"
            );

        if (Array.isArray(savedFavorites)) {

            favorites =
                savedFavorites.filter(
                    url => ALL_LINKS.includes(url)
                );

        }

        const savedQueue =
            JSON.parse(
                localStorage.getItem(
                    STORAGE.queue
                ) || "[]"
            );

        if (Array.isArray(savedQueue)) {
            shuffledQueue = savedQueue;
        }

        currentIndex =
            Number(
                localStorage.getItem(
                    STORAGE.index
                )
            ) || 0;

        lastOpenedUrl =
            localStorage.getItem(
                STORAGE.last
            ) || "";

    } catch (error) {

        favorites = [];
        shuffledQueue = [];
        currentIndex = 0;
        lastOpenedUrl = "";

    }

}


/* =============================================================
   SAVE
============================================================= */

function saveFavorites() {

    localStorage.setItem(
        STORAGE.favorites,
        JSON.stringify(favorites)
    );

}


function saveQueue() {

    localStorage.setItem(
        STORAGE.queue,
        JSON.stringify(shuffledQueue)
    );

    localStorage.setItem(
        STORAGE.index,
        String(currentIndex)
    );

}


/* =============================================================
   SHUFFLE
============================================================= */

function shuffle(array) {

    const result = [...array];

    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [result[i], result[j]] =
            [result[j], result[i]];

    }

    return result;

}


function setupQueue() {

    const valid =
        shuffledQueue.length === ALL_LINKS.length &&
        ALL_LINKS.every(
            url => shuffledQueue.includes(url)
        );

    if (!valid) {

        shuffledQueue =
            shuffle(ALL_LINKS);

        currentIndex = 0;

        saveQueue();

    }

    if (
        currentIndex < 0 ||
        currentIndex >= shuffledQueue.length
    ) {

        currentIndex = 0;

        saveQueue();

    }

}


function openRandom() {

    setupQueue();

    const url =
        shuffledQueue[currentIndex];

    currentIndex++;

    if (
        currentIndex >=
        shuffledQueue.length
    ) {

        shuffledQueue =
            shuffle(ALL_LINKS);

        currentIndex = 0;

    }

    saveQueue();

    updateProgress();

    openWebsite(url);

}


function updateProgress() {

    progress.textContent =
        `${currentIndex} / ${ALL_LINKS.length}`;

}


/* =============================================================
   SITE INFO
============================================================= */

function getMeta(url) {

    try {

        const parsed =
            new URL(url);

        const host =
            parsed.hostname
                .toLowerCase()
                .replace(/^www\./, "");

        const path =
            parsed.pathname.toLowerCase();

        /* Special case FIRST */

        if (
            host === "nhentai.net" &&
            path.startsWith(
                "/category/doujinshi"
            )
        ) {

            return NHENTAI_CATEGORY;

        }

        return SITE_META[host] || {
            name: host,
            color: "#58a6ff",
            icon: null
        };

    } catch {

        return {
            name: "Website",
            color: "#58a6ff",
            icon: null
        };

    }

}


function getDomain(url) {

    try {

        return new URL(url)
            .hostname
            .replace(/^www\./, "");

    } catch {

        return "";

    }

}


/* =============================================================
   ICON
============================================================= */

function createIcon(url) {

    const meta =
        getMeta(url);

    const icon =
        document.createElement("div");

    icon.className = "icon";

    icon.style.setProperty(
        "--brand",
        meta.color
    );

    if (meta.icon) {

        const img =
            document.createElement("img");

        img.src =
            meta.icon;

        img.alt = "";

        img.loading =
            "lazy";

        img.decoding =
            "async";

        img.referrerPolicy =
            "no-referrer";

        const fallback =
            document.createElement("div");

        fallback.className =
            "fallback";

        fallback.textContent =
            meta.name
                .charAt(0)
                .toUpperCase();

        img.onerror =
            () => {

                img.style.display =
                    "none";

                fallback.style.display =
                    "flex";

            };

        icon.appendChild(img);
        icon.appendChild(fallback);

    } else {

        const fallback =
            document.createElement("div");

        fallback.className =
            "fallback";

        fallback.style.display =
            "flex";

        fallback.textContent =
            meta.name
                .charAt(0)
                .toUpperCase();

        icon.appendChild(fallback);

    }

    return icon;

}


/* =============================================================
   RENDER EVERYTHING
============================================================= */

function render() {

    content.innerHTML = "";

    renderFavorites();

    CATEGORIES.forEach(
        category => {

            const section =
                document.createElement("section");

            section.className =
                "section";

            const title =
                document.createElement("div");

            title.className =
                "section-title";

            title.innerHTML = `
                <span>${category.name}</span>
                <span>${category.links.length}</span>
            `;

            const links =
                document.createElement("div");

            links.className =
                "links";

            category.links.forEach(
                url => {

                    links.appendChild(
                        createLink(url)
                    );

                }
            );

            section.appendChild(title);
            section.appendChild(links);

            content.appendChild(section);

        }
    );

}


/* =============================================================
   FAVORITES
============================================================= */

function renderFavorites() {

    if (!favorites.length) {
        return;
    }

    const section =
        document.createElement("section");

    section.className =
        "section";

    const title =
        document.createElement("div");

    title.className =
        "section-title";

    title.innerHTML = `
        <span>⭐ Favorites</span>
        <span>${favorites.length}</span>
    `;

    const grid =
        document.createElement("div");

    grid.className =
        "favorites";

    favorites.forEach(
        url => {

            const tile =
                document.createElement("div");

            tile.className =
                "favorite";

            tile.appendChild(
                createIcon(url)
            );

            const remove =
                document.createElement("button");

            remove.className =
                "remove-favorite";

            remove.textContent =
                "♥";

            remove.setAttribute(
                "aria-label",
                "Remove favorite"
            );

            remove.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    toggleFavorite(url);

                }
            );

            tile.addEventListener(
                "click",
                () => {

                    openWebsite(url);

                }
            );

            tile.appendChild(remove);

            grid.appendChild(tile);

        }
    );

    section.appendChild(title);
    section.appendChild(grid);

    content.appendChild(section);

}


/* =============================================================
   NORMAL LINK
============================================================= */

function createLink(url) {

    const meta =
        getMeta(url);

    const row =
        document.createElement("div");

    row.className =
        "link";

    row.style.setProperty(
        "--brand",
        meta.color
    );


    /* ICON */

    row.appendChild(
        createIcon(url)
    );


    /* TEXT */

    const info =
        document.createElement("div");

    info.className =
        "link-info";

    const name =
        document.createElement("div");

    name.className =
        "name";

    name.textContent =
        meta.name;

    const domain =
        document.createElement("div");

    domain.className =
        "domain";

    domain.textContent =
        getDomain(url);

    info.appendChild(name);
    info.appendChild(domain);

    row.appendChild(info);


    /* HEART */

    const heart =
        document.createElement("button");

    heart.className =
        "heart";

    const isFavorite =
        favorites.includes(url);

    if (isFavorite) {
        heart.classList.add("active");
    }

    heart.textContent =
        isFavorite ? "♥" : "♡";

    heart.setAttribute(
        "aria-label",
        isFavorite
            ? "Remove favorite"
            : "Add favorite"
    );

    heart.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            toggleFavorite(url);

        }
    );

    row.appendChild(heart);


    /* WHOLE ROW OPENS WEBSITE */

    row.addEventListener(
        "click",
        () => {

            openWebsite(url);

        }
    );


    return row;

}


/* =============================================================
   FAVORITE TOGGLE
============================================================= */

function toggleFavorite(url) {

    const index =
        favorites.indexOf(url);

    if (index !== -1) {

        favorites.splice(index, 1);

        showToast(
            "Removed from favorites"
        );

    } else {

        favorites.push(url);

        showToast(
            "Added to favorites"
        );

    }

    saveFavorites();

    render();

}


/* =============================================================
   OPEN WEBSITE INSIDE PWA
============================================================= */

function openWebsite(url) {

    if (!url) {
        return;
    }

    lastOpenedUrl =
        url;

    localStorage.setItem(
        STORAGE.last,
        url
    );

    /*
        This is the important bit.

        We NEVER do:

            window.open(url)

        We NEVER do:

            window.location = url

        We simply put the website inside our iframe.
    */

    websiteFrame.src =
        "about:blank";

    requestAnimationFrame(
        () => {

            websiteFrame.src =
                url;

        }
    );

    websiteView.classList.add(
        "open"
    );

    websiteView.setAttribute(
        "aria-hidden",
        "false"
    );

    document.body.style.overflow =
        "hidden";

}


/* =============================================================
   SEARCH
============================================================= */

function search() {

    const query =
        searchInput.value.trim();

    if (!query) {
        return;
    }


    /* Direct URL */

    if (
        /^https?:\/\//i.test(query)
    ) {

        openWebsite(query);

        return;

    }


    if (
        /^www\./i.test(query)
    ) {

        openWebsite(
            "https://" + query
        );

        return;

    }


    /*
        Otherwise Google search.
    */

    openWebsite(
        "https://www.google.com/search?q=" +
        encodeURIComponent(query)
    );

}


/* =============================================================
   YANDEX
============================================================= */

async function copyForYandex() {

    const url =
        lastOpenedUrl ||
        window.location.href;

    try {

        await navigator.clipboard.writeText(
            url
        );

        showToast(
            "Link copied"
        );

    } catch {

        showToast(
            "Couldn't copy link"
        );

    }

}


/* =============================================================
   TOAST
============================================================= */

let toastTimer;

function showToast(message) {

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1600
        );

}


/* =============================================================
   EVENTS
============================================================= */

randomButton.addEventListener(
    "click",
    openRandom
);

searchButton.addEventListener(
    "click",
    search
);

searchInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            search();

        }

    }
);

yandexButton.addEventListener(
    "click",
    copyForYandex
);


/* =============================================================
   START
============================================================= */

loadData();

setupQueue();

count.textContent =
    `${ALL_LINKS.length} links`;

updateProgress();

render();

</script>

</body>
</html>
